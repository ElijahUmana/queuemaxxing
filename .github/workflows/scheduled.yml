name: scheduled-verification

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: chmod +x scripts/fuzz.sh
      - run: FUZZ_TIME=30m scripts/fuzz.sh
      - name: Upload fuzz corpus and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ github.run_attempt }}
          path: |
            artifacts/
            **/testdata/fuzz/
          if-no-files-found: ignore

  race-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: engine
            package: ./internal/engine
            regex: ^Test(ConcurrentReceiveHasSingleLeasePerMessage|ConcurrentEnqueueSequencesAreUnique|LongPollWakesOnEnqueue|ReceiveLongPollCancellationReleasesWaiter|CloseWakesLongPollAndReleasesWaiter|MutationCoordinatorBatchesConcurrentEnqueuesInOrder|MutationCoordinatorInvalidNeighborAndBatchFailureIsolation|MutationCoordinatorCancellationAndCloseDrain|MutationCoordinatorRealJournalCoalescesAndRecovers|MutationCoordinatorSpeculativeReplayWaitsForDurability|MutationCoordinatorReplaySurvivesNeighborPersistenceFailure|MutationCoordinatorAdmissionFailsFastWhenSaturated|MutationCoordinatorFreezesQueuedRequestInputs|MutationCoordinatorClosingVisibilityAndFinalization|MutationCoordinatorSerializesCompactionWithBlockedBatch|MutationCoordinatorPostInclusionCancellationCommits|MutationCoordinatorBoundsBatchSize)$
          - name: journal
            package: ./internal/journal
            regex: ^Test(GroupCommitSharesDurabilityBoundary|GroupCommitSyncFailureRejectsWholeBatch|ConcurrentAppendProducesContiguousDurableLSNs|ConcurrentCloseReturnsSameErrorAndReleasesStorage|CloseDrainsAcceptedAppendsAndRejectsNewOnes|ConcurrentOversizedBatchesAreRejectedWithoutMutation)$
          - name: integration
            package: ./internal/integration
            regex: ^Test(EngineMatchesReferenceOrderingAndRestart|EngineRestartPreservesDelayedAndAckedState|NewestWALTornTailRecoveryAtEveryOffset|TruncatingBelowDurableHeadRefusesStartup|WALCorruptionRefusesStartup)$
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go install golang.org/x/tools/cmd/stress@latest
      - name: Compile race ${{ matrix.name }} tests
        run: mkdir -p artifacts && go test -race -c -o "artifacts/${{ matrix.name }}-race.test" "${{ matrix.package }}"
      - name: Run finite ${{ matrix.name }} race stress
        shell: bash
        env:
          TEST_REGEX: ${{ matrix.regex }}
        run: |
          set -u
          set +e
          timeout --signal=TERM --kill-after=15s 30m \
            stress -failfast -p 8 -timeout 5m -o "artifacts/race-stress-${{ matrix.name }}-failure-" \
            "$GITHUB_WORKSPACE/artifacts/${{ matrix.name }}-race.test" \
            -test.run "$TEST_REGEX" \
            2>&1 | tee "artifacts/race-stress-${{ matrix.name }}.log"
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          stress_status=${pipeline_status[0]}
          tee_status=${pipeline_status[1]}
          if (( tee_status != 0 )); then
            printf 'tee failed with status %d\n' "$tee_status" >&2
            exit "$tee_status"
          fi
          if (( stress_status != 124 )); then
            printf 'race stress exited before the 30-minute bound with status %d\n' "$stress_status" >&2
            if (( stress_status == 0 )); then
              exit 1
            fi
            exit "$stress_status"
          fi
          printf 'race stress completed the bounded 30-minute window\n'
      - name: Upload ${{ matrix.name }} race evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: race-stress-${{ matrix.name }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: ignore

  corruption:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Exhaust every WAL byte and bit
        run: go test ./internal/integration -run '^TestWALCorruptionRefusesStartupEveryByteAndBit$' -count=1 -v
        env:
          QMAX_EXHAUSTIVE_CORRUPTION: "1"
      - name: Upload corruption evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corruption-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: ignore

  load:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go install go.k6.io/k6@latest
      - run: make build-server
      - name: Run full queue soak
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/load data/load
          ./bin/qmax -listen 127.0.0.1:8080 -data-dir data/load >artifacts/load/qmax.stdout 2>artifacts/load/qmax.stderr &
          echo $! > artifacts/load/qmax.pid
          timeout 30s sh -c 'until curl --fail --silent http://127.0.0.1:8080/health/ready; do sleep 0.05; done'
          QMAX_TEST_URL=http://127.0.0.1:8080 QMAX_DURATION=30m k6 run --summary-export artifacts/load/summary.json test/load/soak.js | tee artifacts/load/k6.log
      - name: Upload load evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-${{ github.run_attempt }}
          path: artifacts/load/
          if-no-files-found: error

  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: chmod +x scripts/benchmark.sh
      - run: scripts/benchmark.sh
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
