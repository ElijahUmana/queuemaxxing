name: verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify format, vet, shuffled coverage, and race
        shell: bash
        env:
          SKIP_FORMAT_CHECK: ${{ runner.os == 'Windows' && '1' || '0' }}
        run: ./scripts/verify.sh
      - name: Real binary crash durability
        if: runner.os == 'Linux'
        run: go test ./internal/integration -run '^TestRealBinarySIGKILLPreservesConfirmedMutations$' -count=1 -v
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-${{ matrix.os }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: ignore

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      - run: govulncheck ./...
      - run: staticcheck ./...
      - name: Security scan
        run: mkdir -p artifacts/security && gosec -fmt=json -out=artifacts/security/gosec.json ./...
      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-${{ github.run_attempt }}
          path: artifacts/security/
          if-no-files-found: ignore

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start containers
        run: docker compose up --build --detach --wait --wait-timeout 120
      - name: Verify nonroot runtime and durable mutation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/container
          container_id=$(docker compose ps --quiet queue)
          uid=$(docker inspect --format '{{.Config.User}}' "$container_id")
          case "$uid" in
            ''|*[!0-9]*|0) printf 'queue container has invalid nonroot UID %s\n' "$uid" >&2; exit 1 ;;
          esac
          printf '%s\n' "$uid" > artifacts/container/queue-uid.txt
          curl --fail --silent http://127.0.0.1:8080/health/ready
          curl --fail --silent http://127.0.0.1:8081/healthz
          curl --fail --silent --show-error \
            --request POST http://127.0.0.1:8080/v1/queues \
            --header 'Content-Type: application/json' \
            --data '{"name":"container-ci","ordering":"fifo","default_visibility_timeout_ms":30000,"max_deliveries":3}'
          curl --fail --silent --show-error \
            --request POST http://127.0.0.1:8080/v1/queues/container-ci/messages \
            --header 'Content-Type: application/json' \
            --header 'Idempotency-Key: container-enqueue' \
            --data '{"payload":{"source":"container-ci"}}' \
            | tee artifacts/container/enqueue-before-restart.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("artifacts/container/enqueue-before-restart.json").read_text())
          Path("artifacts/container/message-id.txt").write_text(data["data"]["id"])
          PY
      - name: Recreate queue with named volume
        shell: bash
        run: |
          set -euo pipefail
          docker compose stop queue
          docker compose rm --force queue
          docker compose up --detach --wait --wait-timeout 120 queue
          curl --fail --silent http://127.0.0.1:8080/health/ready
      - name: Verify persisted read, receive, and acknowledge
        shell: bash
        run: |
          set -euo pipefail
          message_id=$(cat artifacts/container/message-id.txt)
          curl --fail --silent --show-error \
            "http://127.0.0.1:8080/v1/queues/container-ci" \
            | tee artifacts/container/queue-after-restart.json
          curl --fail --silent --show-error \
            "http://127.0.0.1:8080/v1/queues/container-ci/messages" \
            | tee artifacts/container/messages-after-restart.json
          curl --fail --silent --show-error \
            --request POST http://127.0.0.1:8080/v1/queues/container-ci/messages:receive \
            --header 'Content-Type: application/json' \
            --data '{"visibility_timeout_ms":30000}' \
            | tee artifacts/container/receive-after-restart.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          expected_id = Path("artifacts/container/message-id.txt").read_text()
          queue = json.loads(Path("artifacts/container/queue-after-restart.json").read_text())
          messages = json.loads(Path("artifacts/container/messages-after-restart.json").read_text())
          received = json.loads(Path("artifacts/container/receive-after-restart.json").read_text())
          assert queue["config"]["name"] == "container-ci"
          assert any(message["id"] == expected_id for message in messages["messages"])
          assert len(received["messages"]) == 1
          delivery = received["messages"][0]
          assert delivery["message"]["id"] == expected_id
          assert delivery["message"]["payload"]["source"] == "container-ci"
          Path("artifacts/container/ack-after-restart.json").write_text(json.dumps({"receipt_handle": delivery["receipt_handle"]}))
          PY
          curl --fail --silent --show-error \
            --request POST "http://127.0.0.1:8080/v1/queues/container-ci/messages/${message_id}/ack" \
            --header 'Content-Type: application/json' \
            --header 'Idempotency-Key: container-ack-after-restart' \
            --data @artifacts/container/ack-after-restart.json \
            | tee artifacts/container/ack-response.json
      - name: Capture container logs
        if: always()
        run: mkdir -p artifacts/container && docker compose logs --no-color > artifacts/container/compose.log
      - name: Stop containers
        if: always()
        run: docker compose down --volumes
      - name: Upload container evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-${{ github.run_attempt }}
          path: artifacts/container/
          if-no-files-found: ignore

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: test/browser/package-lock.json
      - run: make build
      - run: npm ci --prefix test/browser
      - run: npx --prefix test/browser playwright install --with-deps chromium firefox webkit
      - name: Start real services
        shell: bash
        run: |
          mkdir -p artifacts/e2e data/e2e
          ./bin/qmax -listen 127.0.0.1:8080 -data-dir data/e2e >artifacts/e2e/qmax.stdout 2>artifacts/e2e/qmax.stderr &
          echo $! > artifacts/e2e/qmax.pid
          ./bin/qmax-workbench -listen 127.0.0.1:8081 -api-url http://127.0.0.1:8080 >artifacts/e2e/workbench.stdout 2>artifacts/e2e/workbench.stderr &
          echo $! > artifacts/e2e/workbench.pid
          timeout 30s sh -c 'until curl --fail --silent http://127.0.0.1:8081/healthz; do sleep 0.05; done'
      - name: Run browser tests
        run: npm test --prefix test/browser
        env:
          QMAX_WORKBENCH_URL: http://127.0.0.1:8081
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: ignore
